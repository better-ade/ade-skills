name: release
on:
  push: { branches: [main], paths: [VERSION] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  release:
    uses: better-ade/.github/.github/workflows/release.yml@v1
    with: { command: "bash tests/run.sh", runs-on: ubuntu-latest, setup: "npm install -g @anthropic-ai/claude-code@2.1.330 && curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks && sudo mv gitleaks /usr/local/bin/" }
